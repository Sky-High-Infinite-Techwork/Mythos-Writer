        run: echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"

      - name: Code (Engine main, read-only token)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SkyyPlayz/Mythos-Engine
          ref: main
          token: ${{ secrets.MYTHOS_ENGINE_READ_TOKEN }}
          path: code
          persist-credentials: false

      - name: State (engine-state branch)
        if: needs.tick.outputs.mode != 'selftest'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.DATA_REPO }}
          ref: engine-state
          token: ${{ secrets.MYTHOS_DATA_TOKEN }}
          path: state
          persist-credentials: false


      - name: Notes (data repo main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.DATA_REPO }}
          ref: main
          path: notes
          token: ${{ secrets.MYTHOS_DATA_TOKEN }}
          persist-credentials: false

      - name: Notes root
        run: |
          set -euo pipefail
          echo "MYTHOS_NOTES_ROOT=$GITHUB_WORKSPACE/notes" >> "$GITHUB_ENV"

      - name: Setup (gate)
        uses: ./code/.github/actions/engine-setup
        with:
          kind: gate
          read-token: ${{ secrets.MYTHOS_READ_TOKEN || github.token }}
          claude-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          codex-auth: ${{ secrets.CODEX_AUTH_JSON }}

      # Skyy 2026-11-26 (quality first): the high-risk Probe runs the real app. Only with the flag probe_electron_cache:
      # a display (xvfb) and Electron's shared libraries on the runner (the sandbox sees /usr read-only), then each pinned
      # Electron zip fetched into the runner's cache, sha256 checked against scripts/data/electron_pins.json
      # (electron_cache.py fetch: https only, no token). No model and no secret here; any miss = the Probe runs without
      # Electron and says so (never a pass for a missing user-path run).
      - name: Electron for the Probe (pinned, checksum-verified; no model, no secret)
        run: |
          set -uo pipefail
          on="$(/usr/bin/python3 -c 'import json; print(json.load(open("code/scripts/data/final_gate.json")).get("probe_electron_cache") is True)')"
          if [ "$on" != True ]; then echo "probe_electron_cache off: no Electron"; exit 0; fi
          { sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends xvfb xauth libnss3 \
              libgtk-3-0t64 libasound2t64 libgbm1 libxss1 libxtst6 libdrm2 fonts-liberation; } >/dev/null \
            || echo "::warning title=Probe Electron::runtime libraries not installed; the Probe may not start the app"
          for v in $(/usr/bin/python3 -c 'import json; print(" ".join(sorted(json.load(open("code/scripts/data/electron_pins.json"))["pins"])))'); do
            /usr/bin/python3 code/scripts/electron_cache.py fetch "$v" >>"$LANES_LOG/electron.log" 2>&1 \
              || echo "::warning title=Probe Electron::fetch $v failed; the Probe runs without Electron"
          done

      - name: Preflight (sandbox selftest, kernel, CLIs)
        env:
          MYTHOS_DATA_ROOT: ${{ runner.temp }}/preflight-data
        working-directory: code/scripts
        run: |
          set -uo pipefail
          install -d -m 0700 "$MYTHOS_DATA_ROOT"
          rc=0
          ( set -e
          uname -r
          # The high-risk Probe's sandbox must pass here, or a live pass would BLOCK every high-risk Probe for a
          # runner fault: fail the job instead (nothing gated).
          "$PY" nogrok_exec.py --selftest
          "$PY" - <<'EOF'
          import nogrok_final_gate as F
          cfg, ok = F.config(), F.group_pidfd_ok()
          print(f"final_gate.json parallel={cfg['parallel']} max_concurrent={cfg['max_concurrent']}; group pidfd ok={ok}")
          assert ok or not cfg["parallel"], "parallel mode needs Linux >= 6.9 group pidfd signals; nothing gated"
          EOF
          # The sandboxed Probe's own boundary check (no model), on a dummy tip: a runner fault fails the job here
          # instead of writing a high-risk Probe BLOCK (sandbox-failed) during a live pass.
          "$PY" - <<'EOF'
          import os, tempfile
          import nogrok_probe_tools as PT
          root = tempfile.mkdtemp(prefix="ngp-pre-")
          os.mkdir(os.path.join(root, "tip"), 0o755)
          with open(os.path.join(root, "tip", "README.md"), "w") as f:
              f.write("preflight\n")
          for name, data in (("tip.diff", ""), ("HEAD_SHA", "0" * 40 + "\n")):
              with open(os.path.join(root, name), "w") as f:
                  f.write(data)
          ok, fails = PT.preflight(root, os.path.realpath(os.environ["NOGROK_HOME"]), PT.claude_bin(),
                                   "fg-actions-preflight")
          assert ok, "Probe sandbox boundary: " + "; ".join(fails[:8])
          print("Probe sandbox boundary: OK")
          EOF
          ) >>"$LANES_LOG/preflight.log" 2>&1 || rc=$?
