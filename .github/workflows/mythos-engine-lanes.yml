name: mythos-engine-lanes

# Phase 3. Heavy engine work on public Writer, behind the "lanes" environment.
# Main, schedule, and manual only. Never a pull-request or pull-request-target event, never forks.
# Public logs print only pass or fail. Every step that runs an engine script sends its full output to
# $LANES_LOG (runner temp); each job's last step pushes those files to the private data repo branch
# lanes-logs (runs/<run id>-<attempt>/<job>/) and prints only a short summary (exit codes, counts, and the
# titles of the scripts' own error/warning lines). Prompts, notes, state and output go to the private data repo
# (vars.MYTHOS_DATA_REPO, default SkyyPlayz/Mythos-Ops). Writer never falls back to Engine.
# Skyy creates the environment and its secrets; this file only names them.
# The data-repo write token is never on disk: every checkout uses persist-credentials: false, and only the
# persist and private-log steps hold MYTHOS_DATA_TOKEN (git reads it through a one-command credential helper).
# Live only when SkyyPlayz/Mythos-Engine variable MYTHOS_LANES_HOST is "writer" (and, for a scheduled or
# chained run, MYTHOS_ENGINE_SCHEDULE is "on"). The fix job runs only when MYTHOS_ENGINE_FIX is "on" and a
# chained run is queued only when MYTHOS_ENGINE_CHAIN is "on" (Engine #184 switches, exact "on", default off).
# A missing control token or an unreadable Engine variable fails admit (red), never a green no-op.
# Rollback: set MYTHOS_LANES_HOST to engine. Engine jobs then run again; this workflow's admit exits green.
# Runs may overlap: there is no workflow-level concurrency group (a 350-min gate must never queue the next tick
# or a fix). Per-job groups (tick, gate, plan, act, fix) keep each stage one at a time, and the tick's in-flight
# check (this file's own runs) skips a stage another run still holds.

on:
  schedule:
    # Hourly at :17 MT-ish (UTC). Offset from Writer's other unattended workflows.
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "pass | dry-run (scan + risk, nothing written or posted) | selftest (prove the runner, no gate)"
        type: choice
        options: [pass, dry-run, selftest]
        default: dry-run
      pr:
        description: "Only this Writer PR number (optional)"
        type: string
        default: ""
      chained:
        description: "Set by the chain job only (a chained run also needs MYTHOS_ENGINE_SCHEDULE and MYTHOS_ENGINE_CHAIN on)"
        type: boolean
        default: false

permissions: {}

env:
  MYTHOS_ENGINE_HERE: actions
  STATE_BRANCH: engine-state
  GATE_APP_ID: "5736520"
  PYTHONUNBUFFERED: "1"
  TZ: America/Denver
  ENGINE_REPO: SkyyPlayz/Mythos-Engine
  DATA_REPO: ${{ vars.MYTHOS_DATA_REPO || 'SkyyPlayz/Mythos-Ops' }}
  # Engine's Phase 2 scripts read MYTHOS_DATA_REPO (and fall back to Engine when it is unset): same value here.
  MYTHOS_DATA_REPO: ${{ vars.MYTHOS_DATA_REPO || 'SkyyPlayz/Mythos-Ops' }}
  LOG_BRANCH: lanes-logs
  WRITER_REPO: Sky-High-Infinite-Techwork/Mythos-Writer

jobs:
  admit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    environment: lanes
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
      mode: ${{ steps.gate.outputs.mode }}
      pr: ${{ steps.gate.outputs.pr }}
      chain: ${{ steps.gate.outputs.chain }}
      fix: ${{ steps.gate.outputs.fix }}
    steps:
      - name: Admit a main-branch run only when Engine lanes-host is writer
        id: gate
        shell: bash
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          MODE: ${{ github.event.inputs.mode }}
          PR: ${{ github.event.inputs.pr }}
          CHAINED: ${{ github.event.inputs.chained }}
          CONTROL: ${{ secrets.MYTHOS_CONTROL_READ_TOKEN }}
          DATA_REPO_VAR: ${{ vars.MYTHOS_DATA_REPO }}
        run: |
          set -euo pipefail
          # ADMIT-BEGIN
          # The only validator of mode and pr (the tick reads these outputs). enabled is written once, at the end:
          # every exit before that leaves it empty, so no later job starts.
          if [ "$REPO" != "Sky-High-Infinite-Techwork/Mythos-Writer" ]; then
            echo "reject: repository" >&2
            exit 1
          fi
          if [ "$REF" != "refs/heads/main" ]; then
            echo "reject: ref is not main" >&2
            exit 1
          fi
          case "$EVENT" in
            schedule|workflow_dispatch) ;;
            *) echo "reject: event" >&2; exit 1 ;;
          esac
          if [ -z "${CONTROL:-}" ]; then
            echo "::error title=Lanes admit::MYTHOS_CONTROL_READ_TOKEN is not set on the lanes environment; nothing runs until it is"
            exit 1
          fi
          # One read of Engine's Actions variables (names and values; these are not secrets). A failed read (expired
          # token, missing variables: read, network) is an error, never "off". Never print the token or the body.
          if ! vars="$(GH_TOKEN="$CONTROL" gh api --paginate "repos/SkyyPlayz/Mythos-Engine/actions/variables?per_page=30" \
                --jq '.variables[] | "\(.name)=\(.value)"' 2>/dev/null)"; then
            echo "::error title=Lanes admit::cannot read SkyyPlayz/Mythos-Engine variables with MYTHOS_CONTROL_READ_TOKEN; nothing runs"
            exit 1
          fi
          var() { printf '%s\n' "$vars" | sed -n "s/^$1=//p" | head -n 1; }
          host="$(var MYTHOS_LANES_HOST)"
          sched="$(var MYTHOS_ENGINE_SCHEDULE)"
          chain="$(var MYTHOS_ENGINE_CHAIN)"
          fix="$(var MYTHOS_ENGINE_FIX)"
          chained=false
          [ "${CHAINED:-}" != true ] || chained=true
          if [ "$EVENT" = "schedule" ]; then
            MODE=pass
          fi
          MODE="${MODE:-dry-run}"
          if [ "$host" != "writer" ]; then
            echo "MYTHOS_LANES_HOST is ${host:-unset}, not writer; exiting without work"
            exit 0
          fi
          if [ -z "${DATA_REPO_VAR:-}" ]; then
            echo "::error title=Lanes admit::Writer variable MYTHOS_DATA_REPO is not set while the lanes host is writer (set it to SkyyPlayz/Mythos-Ops)"
            exit 1
          fi
          if { [ "$EVENT" = "schedule" ] || [ "$chained" = true ]; } && [ "$sched" != "on" ]; then
            echo "MYTHOS_ENGINE_SCHEDULE is not on; exiting without work"
            exit 0
          fi
          if [ "$chained" = true ] && [ "$chain" != "on" ]; then
            echo "MYTHOS_ENGINE_CHAIN is not on; a chained run exits without work"
            exit 0
          fi
          case "$MODE" in
            pass|dry-run|selftest) ;;
            *) echo "reject: mode" >&2; exit 1 ;;
          esac
          if [ -n "${PR:-}" ] && [[ ! "$PR" =~ ^[1-9][0-9]{0,6}$ ]]; then
            echo "reject: pr" >&2
            exit 1
          fi
          {
            echo "mode=$MODE"
            echo "pr=${PR:-}"
            echo "chain=$([ "$chain" = on ] && echo on || echo off)"
            echo "fix=$([ "$fix" = on ] && echo on || echo off)"
            echo "enabled=true"
          } >> "$GITHUB_OUTPUT"
          echo "admitted: mode $MODE, chain $([ "$chain" = on ] && echo on || echo off), fix $([ "$fix" = on ] && echo on || echo off)"
          # ADMIT-END

  tick:
    if: >-
      needs.admit.result == 'success' && needs.admit.outputs.enabled == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: lanes
    concurrency:
      group: mythos-engine-tick
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      pr: ${{ steps.mode.outputs.pr }}
      work: ${{ steps.scan.outputs.work }}
      changed: ${{ steps.pack.outputs.changed }}
      pushed: ${{ steps.persist.outputs.pushed }}
      ready: ${{ steps.ready.outputs.ok }}
      act: ${{ steps.act.outputs.act }}
      plan: ${{ steps.plan.outputs.plan }}
      fix: ${{ steps.fix.outputs.fix }}
      gate_busy: ${{ steps.busy.outputs.gate }}
      plan_busy: ${{ steps.busy.outputs.plan }}
      fix_busy: ${{ steps.busy.outputs.fix }}
    needs: [admit]
    env:
      DELTA_NAME: tick-delta
    steps:
      - name: Confirm the trusted ref before checkout
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$REPO" = "Sky-High-Infinite-Techwork/Mythos-Writer"
          test "$REF" = "refs/heads/main"
          # Full script output goes here (never the public log); the job's Private log step saves it.
          install -d -m 0700 "$RUNNER_TEMP/lanes-log"
          echo "LANES_LOG=$RUNNER_TEMP/lanes-log" >> "$GITHUB_ENV"

      - name: Code (Engine main, read-only token)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SkyyPlayz/Mythos-Engine
          ref: main
          token: ${{ secrets.MYTHOS_ENGINE_READ_TOKEN }}
          path: code
          persist-credentials: false

      - name: Mode and host
        id: mode
        env:
          # admit validated both (its outputs are the only source; no second validator here)
          IN_MODE: ${{ needs.admit.outputs.mode }}
          IN_PR: ${{ needs.admit.outputs.pr }}
        run: |
          set -euo pipefail
          mode="$IN_MODE"
          pr="$IN_PR"
          host="$(/usr/bin/python3 code/scripts/engine_host.py 2>>"$LANES_LOG/mode.log")"
          if [ "$mode" = pass ] && [ "$host" != actions ]; then
            echo "::notice title=Engine host is $host::scripts/data/engine_host.json; this run gates and posts nothing"
            mode=off
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "pr=$pr" >> "$GITHUB_OUTPUT"

      - name: State (engine-state branch)
        id: state
        if: steps.mode.outputs.mode == 'pass' || steps.mode.outputs.mode == 'dry-run'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.DATA_REPO }}
          ref: engine-state
          token: ${{ secrets.MYTHOS_DATA_TOKEN }}
          path: state
          persist-credentials: false

      - name: Setup (read)
        if: steps.mode.outputs.mode != 'off'
        uses: ./code/.github/actions/engine-setup
        with:
          kind: read
          read-token: ${{ secrets.MYTHOS_READ_TOKEN || github.token }}

      - name: Brother seen list (refresh from Writer when older than 2 h; never created here)
        if: steps.mode.outputs.mode == 'pass'
        env:
          MYTHOS_DATA_ROOT: ${{ github.workspace }}/state
        run: |
          set -uo pipefail
          due="$("$PY" - 2>>"$LANES_LOG/brother.log" <<'EOF'
          import os, sys
          sys.path.insert(0, "code/scripts")
          import engine_host as H
          try:
              age, _ = H.seen_age(os.environ["MYTHOS_DATA_ROOT"])
          except ValueError as e:
              print(f"no ({e}: seed engine-state from the box; never created here)"); sys.exit()
          print("yes" if age is None or age > H.SEEN_REFRESH_S else f"no (fresh: {int(age // 60)} min)")
          EOF
          )"
          echo "$due" >>"$LANES_LOG/brother.log"
          # public: a fixed word only (the reason text stays in the private log)
          if [ "$due" = yes ]; then echo "refresh: yes"; else echo "refresh: no"; fi
          if [ "$due" = yes ]; then
            "$PY" code/scripts/watch/brother_watch.py --data-root state --repo Sky-High-Infinite-Techwork/Mythos-Writer \
              >>"$LANES_LOG/brother.log" 2>&1 || echo "::warning title=Brother watch::refresh failed (exit $?); the ready check decides"
          fi

      - name: Ready (brother seen list fresh, Writer unattended gate off)
        id: ready
        if: steps.mode.outputs.mode == 'pass'
        env:
          MYTHOS_DATA_ROOT: ${{ github.workspace }}/state
        run: |
          set -uo pipefail
          if "$PY" code/scripts/engine_host.py --ready >>"$LANES_LOG/ready.log" 2>&1; then echo "ok=true" >> "$GITHUB_OUTPUT"; else
            echo "::error title=Engine not ready::nothing gated or posted this tick (the reason is in the private log)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Flow step (trio-wake rows for green non-draft PRs)
        if: steps.mode.outputs.mode == 'pass' && steps.ready.outputs.ok == 'true'
        env:
          MYTHOS_DATA_ROOT: ${{ github.workspace }}/state
        run: |
          set -uo pipefail
          rc=0; "$PY" -u code/scripts/nogrok_flow_step.py --live >>"$LANES_LOG/flow.log" 2>&1 || rc=$?
          echo "flow step: exit $rc"; exit "$rc"

      # Read only, no secret: does the `act` job (PROOF post + auto-merge arming, the only job that holds
      # MYTHOS_WRITE_TOKEN) have anything to do? A PR in the flow step's proof bucket, or a gate-green armable PR.
      - name: Act scan (PROOF needed or a PR to arm; read only)
        id: act
        if: steps.mode.outputs.mode == 'pass' && steps.ready.outputs.ok == 'true'
        env:
          MYTHOS_DATA_ROOT: ${{ github.workspace }}/state
        run: |
          set -uo pipefail
          p="$("$PY" code/scripts/nogrok_engine_proof.py --count 2>>"$LANES_LOG/act-scan.log")"
          "$PY" -u code/scripts/nogrok_engine_arm.py >>"$LANES_LOG/act-scan.log" 2>&1 || echo "act scan: arm dry run exit $?"
          a="$(grep -c ': ready to arm$' "$LANES_LOG/act-scan.log" || true)"
          case "$p" in ''|*[!0-9]*) p=0 ;; esac
          echo "act: $p PR(s) need a PROOF, $a ready to arm"
          echo "act=$([ "${p:-0}" -gt 0 ] || [ "${a:-0}" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # Read only, no secret value (only whether MYTHOS_WRITE_TOKEN is set): Writer issues with the ready-to-plan mark
      # that need a plan step or a packet note (scripts/nogrok_engine_plan.py scan). No work, or no token = no plan job.
      - name: Plan scan (ready-to-plan issues; read only)
        id: plan
        if: (steps.mode.outputs.mode == 'pass' && steps.ready.outputs.ok == 'true') || steps.mode.outputs.mode == 'dry-run'
        env:
          MYTHOS_DATA_ROOT: ${{ github.workspace }}/state
          HAS_WRITE_TOKEN: ${{ secrets.MYTHOS_WRITE_TOKEN != '' }}
        run: |
          set -uo pipefail
          rc=0
          "$PY" code/scripts/nogrok_engine_plan.py scan >"$LANES_LOG/plan-scan.log" 2>&1 || rc=$?
          k="$(sed -n 's/^work=\([0-9][0-9]*\)$/\1/p' "$LANES_LOG/plan-scan.log" | tail -n 1)"
          echo "plan scan: exit $rc, ${k:-0} issue(s) with work"
          if [ "$rc" -ne 0 ]; then
            echo "::warning title=Plan scan::failed (exit $rc); no plan job this tick"; k=0
          elif [ "${k:-0}" -gt 0 ] && [ "$HAS_WRITE_TOKEN" != true ]; then
            echo "::notice title=Plan lane off::MYTHOS_WRITE_TOKEN is not set: $k ready-to-plan issue(s) wait (drafts and grades post on the issue)"; k=0
          fi
          echo "plan=$([ "${k:-0}" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # Read only, no secret: is a Writer PR due an engine fix round (scripts/nogrok_autofix.py --count)? With the
      # autofix flag off (as shipped) it reads nothing and prints 0, so the fix job never starts.
      - name: Fix scan (PRs due a fix round; read only)
        id: fix
        if: steps.mode.outputs.mode == 'pass' && steps.ready.outputs.ok == 'true'
        env:
          MYTHOS_DATA_ROOT: ${{ github.workspace }}/state
          FIX_ON: ${{ needs.admit.outputs.fix }}
        run: |
          set -uo pipefail
          n="$("$PY" code/scripts/nogrok_autofix.py --count 2>>"$LANES_LOG/fix-scan.log")" || echo "::warning title=Fix scan::exit $? (counted ${n:-0})"
          case "$n" in ''|*[!0-9]*) n=0 ;; esac
          echo "fix: $n PR(s) due a fix round"
          if [ "$n" -gt 0 ] && [ "$FIX_ON" != on ]; then
            echo "::notice title=Fix round due (FIX off)::$n PR(s) wait until Engine variable MYTHOS_ENGINE_FIX is on"
          fi
          echo "fix=$([ "$n" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Gate App key
        if: (steps.mode.outputs.mode == 'pass' && steps.ready.outputs.ok == 'true') || steps.mode.outputs.mode == 'selftest'
        env:
          MYTHOS_GATE_APP_PRIVATE_KEY: ${{ secrets.MYTHOS_GATE_APP_PRIVATE_KEY }}
          INSTALLATION_ID: ${{ vars.MYTHOS_GATE_APP_INSTALLATION_ID }}
        run: |
          set -euo pipefail
          "$PY" code/scripts/actions_runtime.py gate-app --dir "$RUNNER_TEMP/gate-app" --app-id "$GATE_APP_ID" \
            --installation-id "$INSTALLATION_ID" >>"$LANES_LOG/gate-app.log" 2>&1
          echo "MYTHOS_GATE_APP_DIR=$RUNNER_TEMP/gate-app" >> "$GITHUB_ENV"

      - name: Publish mythos/final-gate
        if: steps.mode.outputs.mode == 'pass' && steps.ready.outputs.ok == 'true'
        env:
          MYTHOS_DATA_ROOT: ${{ github.workspace }}/state
        run: |
          set -uo pipefail
          rc=0; "$PY" -u code/scripts/nogrok_gate_publish.py --live >>"$LANES_LOG/publish.log" 2>&1 || rc=$?
          echo "publish: exit $rc"; exit "$rc"

      - name: Selftest (reads, App token exchange; no write)
        if: steps.mode.outputs.mode == 'selftest'
        env:
          MYTHOS_DATA_ROOT: ${{ runner.temp }}/selftest-data
        working-directory: code/scripts
        run: |
          set -uo pipefail
          install -d -m 0700 "$MYTHOS_DATA_ROOT"
          rc=0
          ( set -e
          "$PY" - <<'EOF'
          import gh_ro, nogrok_gate_publish as P
          pulls = gh_ro.get(f"repos/{P.REPO}/pulls?state=open&per_page=100", paginate=True)
          assert isinstance(pulls, list), f"gh_ro read failed ({gh_ro.LAST_ERROR[0]})"
          print(f"gh_ro: {len(pulls)} open Writer PR(s) read")
          app_id, inst, key = P.load_app()
          tok, why = P.mint(app_id, inst, key)
          assert tok, why
          print("App 5736520: installation token minted (checks + statuses, Mythos-Writer only); not used")
          EOF
          ) >>"$LANES_LOG/selftest.log" 2>&1 || rc=$?
          echo "selftest: exit $rc"; exit "$rc"

      - name: Scan
        id: scan
        if: steps.mode.outputs.mode == 'selftest' || steps.mode.outputs.mode == 'dry-run' || steps.ready.outputs.ok == 'true'
        env:
          MYTHOS_DATA_ROOT: ${{ github.workspace }}/state
          PR: ${{ steps.mode.outputs.pr }}
          MODE: ${{ steps.mode.outputs.mode }}
        run: |
          set -euo pipefail
          if [ "$MODE" = selftest ]; then echo "work=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          "$PY" code/scripts/nogrok_final_gate.py scan ${PR:+--pr "$PR"} >"$LANES_LOG/scan.log" 2>&1
          n="$(grep -c ': candidate$' "$LANES_LOG/scan.log" || true)"
          w="$(grep -c ': waiting (' "$LANES_LOG/scan.log" || true)"
          echo "scan: $n candidate(s), $w waiting"
          [ "$n" -gt 0 ] || echo "no candidate ($w waiting): no gate job this tick"
          echo "work=$([ "$n" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # Runs may overlap (see the header). Another run of THIS workflow with a queued or running gate / plan / fix job
      # (each job persists its own state, so the job itself is the hold) means this run skips that stage; the next
      # tick or chained run picks it up. A read that fails is an error (the tick fails, loud): it never counts as busy,
      # which would skip every stage forever without a sign. actions: read is for this step only.
      - name: In-flight check (stages another engine run still holds)
        id: busy
        if: steps.mode.outputs.mode == 'pass' && steps.ready.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail
          gate=false; plan=false; fix=false
          live='select(.status=="queued" or .status=="in_progress" or .status=="waiting" or .status=="pending" or .status=="requested")'
          # Every live run, by status (not the newest page of all runs: a long gate run must never fall off it).
          ids=""
          wf=mythos-engine-lanes.yml
          for st in in_progress queued waiting pending requested; do
            if ! got="$(gh api --paginate "repos/$REPO/actions/workflows/$wf/runs?status=$st&per_page=100" \
                  --jq ".workflow_runs[]|select(.id != $RUN_ID)|.id" 2>>"$LANES_LOG/busy.log")"; then
              echo "::error title=In-flight check::cannot read $wf runs; nothing gated, planned or fixed this run"
              { echo "gate=true"; echo "plan=true"; echo "fix=true"; } >> "$GITHUB_OUTPUT"
              exit 1
            fi
            ids="$ids $got"
          done
          # shellcheck disable=SC2086  # $ids is a space-separated list of numeric run ids
          for id in $(printf '%s\n' $ids | sort -u); do
            if ! names="$(gh api --paginate "repos/$REPO/actions/runs/$id/jobs?per_page=100" --jq ".jobs[]|$live|.name" \
                  2>>"$LANES_LOG/busy.log")"; then
              echo "::error title=In-flight check::cannot read the jobs of run $id; nothing gated, planned or fixed this run"
              { echo "gate=true"; echo "plan=true"; echo "fix=true"; } >> "$GITHUB_OUTPUT"
              exit 1
            fi
            if printf '%s\n' "$names" | grep -qx gate; then gate=true; fi
            if printf '%s\n' "$names" | grep -qx plan; then plan=true; fi
            if printf '%s\n' "$names" | grep -qx fix; then fix=true; fi
          done
          echo "in flight elsewhere: gate=$gate plan=$plan fix=$fix"
          { echo "gate=$gate"; echo "plan=$plan"; echo "fix=$fix"; } >> "$GITHUB_OUTPUT"

      - name: WAKE lines (to logs/engine/wake.jsonl + annotations)
        if: always() && steps.mode.outputs.mode == 'pass' && steps.state.outcome == 'success'
        env:
          MYTHOS_DATA_ROOT: ${{ github.workspace }}/state
        run: |
          set -uo pipefail
          rc=0; /usr/bin/python3 code/scripts/engine_state.py wake --root state --job tick >>"$LANES_LOG/wake.log" 2>&1 || rc=$?
          n="$(grep -c '^::warning' "$LANES_LOG/wake.log" || true)"
          [ "${n:-0}" -eq 0 ] || echo "::warning title=Engine WAKE (tick)::$n alert line(s); rows are in logs/engine/wake.jsonl on the data repo"
          echo "wake: exit $rc"; exit "$rc"

      - name: Pack tick state writes
        id: pack
        if: always() && steps.mode.outputs.mode == 'pass' && steps.state.outcome == 'success'
        run: |
          set -euo pipefail
          base="$(git -C state rev-parse HEAD)"
          /usr/bin/python3 code/scripts/engine_state.py pack --producer tick --root state --base "$base" \
            --out "$RUNNER_TEMP/$DELTA_NAME" >>"$LANES_LOG/pack.log" 2>&1
          n="$(/usr/bin/python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))["entries"]))' "$RUNNER_TEMP/$DELTA_NAME/manifest.json")"
          echo "pack: $n entr(ies)"
          echo "changed=$([ "$n" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"


      - name: Not ready fails the tick (the watcher raises it)
        if: steps.mode.outputs.mode == 'pass' && steps.ready.outputs.ok != 'true'
        run: exit 1

      - name: Persist to the private data repo (no public artifact)
        id: persist
        if: always() && steps.pack.outputs.changed == 'true'
        env:
          PRODUCER: tick
          MYTHOS_DATA_ROOT: ${{ github.workspace }}/state
          DATA_TOKEN: ${{ secrets.MYTHOS_DATA_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
        run: |
          set -uo pipefail
          # PERSIST-BEGIN (the same text in tick, gate, plan and fix; only PRODUCER and DELTA_NAME differ)
          # Notes and state stay on the private data repo. Nothing is uploaded as a public artifact. The data token is
          # in this step's env only (every checkout keeps persist-credentials: false); git reads it through a
          # one-command credential helper, never from disk, a remote URL or argv. Re-applied onto the newest
          # engine-state when a push races (gate, plan, fix and tick push the same branch), up to 5 tries (Engine).
          export GIT_TERMINAL_PROMPT=0
          # shellcheck disable=SC2016  # $DATA_TOKEN expands inside the helper's own shell, not here
          sgit() { git -C state -c credential.helper= \
            -c 'credential.helper=!f(){ echo username=x-access-token; echo "password=$DATA_TOKEN"; }; f' "$@"; }
          log="$LANES_LOG/persist.log"
          msg="engine: $PRODUCER state ($RUN_URL)"
          delta="$RUNNER_TEMP/$DELTA_NAME"
          # reset + clean: the job's own untracked writes go, so apply puts each append line on exactly once (S7)
          if ! { sgit fetch -q origin "$STATE_BRANCH" && git -C state reset -q --hard FETCH_HEAD && git -C state clean -ffdxq; } >>"$log" 2>&1; then
            echo "::error title=Persist::cannot fetch $STATE_BRANCH from the data repo"; exit 1
          fi
          for try in 1 2 3 4 5; do
            rc=0; /usr/bin/python3 code/scripts/engine_state.py apply --producer "$PRODUCER" --delta "$delta" >>"$log" 2>&1 || rc=$?
            # 3 = a verdict conflict (the rest applied): pushed, then the step fails with 3, as in Engine.
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then echo "persist: apply exit $rc"; exit "$rc"; fi
            if ! /usr/bin/python3 code/scripts/engine_state.py list --producer "$PRODUCER" --root state -z 2>>"$log" \
                | (cd state && xargs -0 -r git add --); then
              echo "persist: list or add failed"; exit 1
            fi
            if git -C state diff --cached --quiet; then
              echo "pushed=false" >> "$GITHUB_OUTPUT"; echo "persist: nothing new to push (apply exit $rc)"; exit "$rc"
            fi
            git -C state -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "$msg" >>"$log" 2>&1 || { echo "persist: commit failed"; exit 1; }
            if sgit push -q origin "HEAD:$STATE_BRANCH" >>"$log" 2>&1; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"; echo "persist: pushed (apply exit $rc)"; exit "$rc"
            fi
            if [ "$try" -lt 5 ]; then
              sleep "$(( try * 3 + RANDOM % 5 ))"  # jittered backoff: gate, plan and fix often finish together
            fi
            if ! { sgit fetch -q origin "$STATE_BRANCH" && git -C state reset -q --hard FETCH_HEAD && git -C state clean -ffdxq; } >>"$log" 2>&1; then
              echo "::error title=Persist::cannot re-fetch $STATE_BRANCH after a rejected push"; exit 1
            fi
            # a push that landed but reported failure (timeout) is not applied twice
            if git -C state log -n 50 --format=%s FETCH_HEAD | grep -qxF "$msg"; then
              echo "pushed=true" >> "$GITHUB_OUTPUT"; echo "persist: pushed (apply exit $rc)"; exit "$rc"
            fi
          done
          echo "::error title=Persist::push to $STATE_BRANCH failed 5 times; this job's state was not saved"
          exit 1
          # PERSIST-END
      - name: Private log (full output to the data repo; public shows only a summary)
        id: privlog
        if: always()
        env:
          JOB: tick
          DATA_TOKEN: ${{ secrets.MYTHOS_DATA_TOKEN }}
          RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -uo pipefail
          # PRIVLOG-BEGIN (the same text in every job that runs engine scripts; only JOB differs)
          # Public: the titles of the scripts' own ::error / ::warning lines (short fixed names, nothing else) and
          # pass or fail. Private: every $LANES_LOG file, at most 5 MiB each (the tail), on the data repo branch
          # LOG_BRANCH under runs/<run id>-<attempt>/<job>/. Token: this step's env only, through a credential helper.
          # Growth bound: only non-empty logs are saved (a no-work run commits nothing); each file is capped at 5 MiB.
          # Dirs are runs/<YYYY-MM-DD>/<run id>-<attempt>/<job>/ so an owner-approved prune can drop old days whole.
          # Nothing here deletes or rewrites the branch (deletes are an owner call).
          if [ -z "${LANES_LOG:-}" ] || [ -z "$(find "$LANES_LOG" -maxdepth 1 -type f -size +0 2>/dev/null | head -n 1)" ]; then
            echo "private log: nothing to save"; exit 0
          fi
          for f in "$LANES_LOG"/*.log; do
            grep -ohE '^::(error|warning) title=[A-Za-z0-9 ()._/-]{1,60}::' "$f" 2>/dev/null || true
          done | sort -u | sed 's/::$/::details are in the private log/'
          if [ -z "${DATA_TOKEN:-}" ]; then
            echo "::error title=Private log::MYTHOS_DATA_TOKEN is not set; this job's full output was not saved"; exit 1
          fi
          export GIT_TERMINAL_PROMPT=0
          repo="$RUNNER_TEMP/lanes-log-repo"
          dest="runs/$(TZ=America/Denver date +%F)/$RUN_KEY/$JOB"
          # shellcheck disable=SC2016  # $DATA_TOKEN expands inside the helper's own shell, not here
          lgit() { git -C "$repo" -c credential.helper= \
            -c 'credential.helper=!f(){ echo username=x-access-token; echo "password=$DATA_TOKEN"; }; f' "$@"; }
          for try in 1 2 3 4 5; do
            if [ "$try" -gt 1 ]; then
              sleep "$(( try * 3 + RANDOM % 5 ))"  # jittered backoff: gate, plan and fix often finish together
            fi
            rm -rf "$repo"; git init -q "$repo"
            git -C "$repo" remote add origin "https://github.com/$DATA_REPO.git"
            r=0; lgit ls-remote --exit-code origin "refs/heads/$LOG_BRANCH" >/dev/null 2>&1 || r=$?
            if [ "$r" -eq 0 ]; then
              if ! { lgit fetch -q --depth 1 origin "$LOG_BRANCH" && git -C "$repo" reset -q --hard FETCH_HEAD; } >/dev/null 2>&1; then
                echo "::error title=Private log::cannot fetch $LOG_BRANCH"; exit 1
              fi
            elif [ "$r" -eq 2 ]; then
              git -C "$repo" symbolic-ref HEAD "refs/heads/$LOG_BRANCH"
            else
              echo "::error title=Private log::cannot read the data repo"; exit 1
            fi
            mkdir -p "$repo/$dest"
            for f in "$LANES_LOG"/*; do
              [ -f "$f" ] && [ -s "$f" ] || continue
              tail -c 5242880 "$f" > "$repo/$dest/$(basename "$f")"
            done
            git -C "$repo" add -- "$dest"
            if git -C "$repo" diff --cached --quiet; then echo "private log: nothing new"; exit 0; fi
            git -C "$repo" -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "lanes: $JOB log ($RUN_KEY)" >/dev/null || { echo "private log: commit failed"; exit 1; }
            if lgit push -q origin "HEAD:refs/heads/$LOG_BRANCH" >/dev/null 2>&1; then echo "private log: saved"; exit 0; fi
          done
          echo "::error title=Private log::push to $LOG_BRANCH failed 5 times"
          exit 1
          # PRIVLOG-END
      - name: Public result (pass/fail only)
        if: always()
        run: echo "result=${{ job.status == 'success' && 'pass' || 'fail' }}"
  gate:
    needs: [admit, tick]
    if: >-
      needs.admit.result == 'success' && needs.admit.outputs.enabled == 'true' && github.ref == 'refs/heads/main' &&
      !cancelled() && needs.tick.result == 'success' && needs.tick.outputs.work == 'true' &&
      needs.tick.outputs.gate_busy == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    environment: lanes
    concurrency:
      group: mythos-engine-gate
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.pack.outputs.changed }}
      pushed: ${{ steps.persist.outputs.pushed }}
    env:
      DELTA_NAME: gate-delta
    steps:
      - name: Confirm the trusted ref before checkout
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$REPO" = "Sky-High-Infinite-Techwork/Mythos-Writer"
          test "$REF" = "refs/heads/main"
