          # login checks all come out of it), at most 330 min of pass, and -k 120 kills 2 min later: always before
          # the job's 350-min cap, so the pass gets TERM and its own cleanup instead of GitHub cancelling the job.
          # Under 20 min left = no pass this run (nothing gated; the next tick retries).
