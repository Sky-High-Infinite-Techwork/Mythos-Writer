          test "$REPO" = "Sky-High-Infinite-Techwork/Mythos-Writer"
          test "$REF" = "refs/heads/main"

      - name: Job clock (the round's TERM deadline counts from here)
        run: echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"

      - name: Code (this commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SkyyPlayz/Mythos-Engine
          ref: main
          token: ${{ secrets.MYTHOS_ENGINE_READ_TOKEN }}
          path: code
          persist-credentials: false

      - name: State (latest engine-state)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.DATA_REPO }}
          ref: engine-state
          token: ${{ secrets.MYTHOS_DATA_TOKEN }}
          path: state
          persist-credentials: true

      # No token = no round: a staged round could never be pushed, so a Claude session would be spent for nothing.
      - name: Notes (data repo main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.DATA_REPO }}
          ref: main
          path: notes
          token: ${{ secrets.MYTHOS_DATA_TOKEN }}
          persist-credentials: false

      - name: Notes root
        run: |
          set -euo pipefail
          echo "MYTHOS_NOTES_ROOT=$GITHUB_WORKSPACE/notes" >> "$GITHUB_ENV"

      - name: Write token present (no model here)
        id: token
        env:
          MYTHOS_WRITE_TOKEN: ${{ secrets.MYTHOS_WRITE_TOKEN }}
        run: |
          if [ -n "${MYTHOS_WRITE_TOKEN:-}" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else
            echo "::notice title=Fix lane off::MYTHOS_WRITE_TOKEN is not set: no fix round (nothing recorded)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup (fix)
        if: steps.token.outputs.ok == 'true'
        uses: ./code/.github/actions/engine-setup
        with:
          kind: fix
          read-token: ${{ secrets.MYTHOS_READ_TOKEN || github.token }}
          claude-token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

      # The round's sandbox must pass its selftest here (recorded for this run's data root, where the round's
      # launch check reads it); a runner fault fails the job before any round (nothing recorded).
      - name: Preflight (sandbox selftest)
        if: steps.token.outputs.ok == 'true'
        env:
          MYTHOS_DATA_ROOT: ${{ github.workspace }}/state
        working-directory: code/scripts
        run: |
          set -euo pipefail
          uname -r
          "$PY" - <<'EOF'
          import nogrok_exec as E
          assert E.launch_ok(run=True), "nogrok_exec sandbox selftest failed; no fix round"
          print("sandbox selftest: pass")
          EOF

      - name: Login check (Claude)
        if: steps.token.outputs.ok == 'true'
        working-directory: code/scripts
        run: |
          set -euo pipefail
          "$PY" - <<'EOF'
          import os, subprocess, sys, tempfile
          import cc_ask
          with tempfile.TemporaryDirectory() as d:
              try:
                  ok = subprocess.run(cc_ask.build_cmd("haiku", "low"), input="Reply with the single word OK.",
                                      text=True, capture_output=True, cwd=d, timeout=300,
                                      env=dict(cc_ask.child_env(), HOME=os.environ["NOGROK_HOME"])).returncode == 0
              except (OSError, subprocess.TimeoutExpired):
                  ok = False
          if not ok:
              print("::error title=Claude login failed::renew CLAUDE_CODE_OAUTH_TOKEN; no fix round this run")
              sys.exit(1)
          print("Claude login: OK")
          EOF

      - name: Fix round (stage only; no write token in this step)
        id: round
        if: steps.token.outputs.ok == 'true'
        env:
          MYTHOS_DATA_ROOT: ${{ github.workspace }}/state
        run: |
          set -uo pipefail
          echo "base=$(git -C state rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          # TERM 125 min after the job's first step (at most 120 min of round), -k 120 kills 2 min later: the push
          # step (15 min cap), WAKE and pack still fit inside the job's 150 min. Under 30 min left = no round.
          left=$(( (JOB_T0 + 125 * 60 - $(date +%s)) / 60 ))
          [ "$left" -le 120 ] || left=120
          if [ "$left" -lt 30 ]; then
            echo "::warning title=No fix round::only ${left} min of job time left after setup; nothing run"
            echo "rc=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          timeout -s TERM -k 120 "${left}m" "$PY" -u code/scripts/nogrok_autofix.py --live --stage "$RUNNER_TEMP/fix-stage"
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      - name: Push the staged round (no model; scripts/nogrok_autofix.py --push)
        id: push
        if: steps.round.outcome == 'success'
        timeout-minutes: 15
        env:
          MYTHOS_DATA_ROOT: ${{ github.workspace }}/state
          MYTHOS_WRITE_TOKEN: ${{ secrets.MYTHOS_WRITE_TOKEN }}
        run: |
          set -uo pipefail
          if [ ! -f "$RUNNER_TEMP/fix-stage/round.json" ]; then echo "no staged round: nothing to push"; exit 0; fi
          "$PY" -u code/scripts/nogrok_autofix.py --push "$RUNNER_TEMP/fix-stage"

      - name: WAKE lines (to logs/engine/wake.jsonl + annotations)
        if: always() && steps.round.outputs.base != ''
        env:
          MYTHOS_DATA_ROOT: ${{ github.workspace }}/state
        run: /usr/bin/python3 code/scripts/engine_state.py wake --root state --job fix

      - name: Pack fix state writes
        id: pack
        if: always() && steps.round.outputs.base != ''
        env:
          BASE: ${{ steps.round.outputs.base }}
        run: |
          set -euo pipefail
          /usr/bin/python3 code/scripts/engine_state.py pack --producer fix --root state --base "$BASE" \
            --out "$RUNNER_TEMP/fix-delta"
          n="$(/usr/bin/python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))["entries"]))' "$RUNNER_TEMP/fix-delta/manifest.json")"
          echo "changed=$([ "$n" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"


      - name: Round result
        if: steps.round.outcome == 'success'
        env:
          RC: ${{ steps.round.outputs.rc }}
        run: |
          echo "fix round exit $RC"
          [ "$RC" = 0 ]

      - name: Persist to the private data repo (no public artifact)
        id: persist
        if: always() && steps.pack.outputs.changed == 'true'
        env:
          PRODUCER: fix
          STATE_BRANCH: engine-state
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # Notes and state stay on SkyyPlayz/Mythos-Ops. Nothing is uploaded as a public artifact.
          git -C state fetch -q origin "$STATE_BRANCH" && git -C state reset -q --hard FETCH_HEAD || exit 1
          /usr/bin/python3 code/scripts/engine_state.py apply --producer "$PRODUCER" --delta "$RUNNER_TEMP/delta" --root state || exit $?
          /usr/bin/python3 code/scripts/engine_state.py list --producer "$PRODUCER" --root state -z \
            | (cd state && xargs -0 -r git add --)
          git -C state -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "engine: $PRODUCER state ($RUN_URL)" || true
          if git -C state push -q origin "HEAD:$STATE_BRANCH"; then echo "pushed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          git -C state fetch -q origin "$STATE_BRANCH" && git -C state reset -q --hard FETCH_HEAD || exit 1
          if git -C state log -n 50 --format=%s FETCH_HEAD | grep -qxF "engine: $PRODUCER state ($RUN_URL)"; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit 1
      - name: Public result (pass/fail only)
        if: always()
        run: echo "result=${{ job.status == 'success' && 'pass' || 'fail' }}"
  chain:
    needs: [admit, tick, gate, publish, act, plan, fix]
    if: >-
      needs.admit.result == 'success' && needs.admit.outputs.enabled == 'true' && github.ref == 'refs/heads/main' &&
      !cancelled() && needs.tick.outputs.mode == 'pass' && needs.tick.outputs.ready == 'true' &&
      github.ref == 'refs/heads/main' &&
      contains(fromJSON('["success","skipped"]'), needs.publish.result) &&
      contains(fromJSON('["success","skipped"]'), needs.act.result) &&
      ((needs.gate.result == 'success' && needs.gate.outputs.changed == 'true') ||
       (needs.plan.result == 'success' && needs.plan.outputs.changed == 'true') ||
       (needs.fix.result == 'success' && needs.fix.outputs.changed == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    environment: lanes
    permissions:
      actions: write
    steps:
      - name: Confirm the trusted ref before checkout
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$REPO" = "Sky-High-Infinite-Techwork/Mythos-Writer"
          test "$REF" = "refs/heads/main"

      - name: Queue the next engine run (work was done this run)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh workflow run mythos-engine-lanes.yml --repo "$REPO" --ref main -f mode=pass

      - name: Public result (pass/fail only)
        if: always()
        run: echo "result=${{ job.status == 'success' && 'pass' || 'fail' }}"
