name: Mythos dispatch

# Phase 2 dispatcher core: build-order scan, official-plan parse, atomic lane claims.
# Build lanes and plan grading arrive in a follow-on PR. See docs/ops/phase2-dispatcher-plan.md.

on:
  schedule:
    # Every ten minutes, offset from flow-step and final-gate.
    - cron: '4,14,24,34,44,54 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run logs would_claim only. act may create lease refs.'
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - act

permissions: {}

jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
      mode: ${{ steps.gate.outputs.mode }}
    steps:
      - name: Admit dispatch when unattended and dispatch switches are true
        id: gate
        shell: bash
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          UNATTENDED: ${{ vars.UNATTENDED_ENABLED }}
          DISPATCH: ${{ vars.MYTHOS_DISPATCH_ENABLED }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          set -euo pipefail
          # ADMIT-BEGIN
          if [ "$REPO" != "Sky-High-Infinite-Techwork/Mythos-Writer" ]; then
            echo "reject: repository" >&2
            exit 1
          fi
          if [ "$REF" != "refs/heads/main" ]; then
            echo "reject: ref is not main" >&2
            exit 1
          fi
          case "$EVENT" in
            schedule|workflow_dispatch) ;;
            *) echo "reject: event" >&2; exit 1 ;;
          esac
          if [ "$EVENT" = "schedule" ]; then
            MODE=act
          fi
          if [ "$UNATTENDED" != "true" ] || [ "$DISPATCH" != "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "mode=inert" >> "$GITHUB_OUTPUT"
            echo "MYTHOS dispatch inert; exiting without writes"
            exit 0
          fi
          case "$MODE" in
            dry-run|act) ;;
            *) echo "reject: mode" >&2; exit 1 ;;
          esac
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          # ADMIT-END

  discover:
    needs: admit
    if: needs.admit.result == 'success' && needs.admit.outputs.enabled == 'true' && needs.admit.outputs.mode == 'dry-run' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: mythos-writer
    permissions:
      contents: read
      issues: read
    steps:
      - name: Confirm the trusted ref before checkout
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$REPO" = "Sky-High-Infinite-Techwork/Mythos-Writer"
          test "$REF" = "refs/heads/main"
      - name: Check out the trusted default-branch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - name: Plan or claim the next build-order slice
        env:
          MODE: ${{ needs.admit.outputs.mode }}
          REPO: Sky-High-Infinite-Techwork/Mythos-Writer
          CONTROL_TOKEN: ${{ secrets.MYTHOS_CONTROL_READ_TOKEN }}
          READ_TOKEN: ${{ github.token }}
        run: node .github/scripts/unattended/dispatch/dispatch-cli.js plan

  sweep:
    needs: admit
    if: needs.admit.result == 'success' && needs.admit.outputs.enabled == 'true' && needs.admit.outputs.mode == 'act' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: mythos-writer
    concurrency:
      group: mythos-unattended-dispatch
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Confirm the trusted ref before reading secrets
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$REPO" = "Sky-High-Infinite-Techwork/Mythos-Writer"
          test "$REF" = "refs/heads/main"
      - name: Check out the trusted default-branch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - name: Mint a contents token for dispatch ref maintenance
        id: write
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.MYTHOS_WRITE_APP_ID }}
          private-key: ${{ secrets.MYTHOS_WRITE_APP_PRIVATE_KEY }}
          owner: Sky-High-Infinite-Techwork
          repositories: Mythos-Writer
          permission-contents: write
      - name: Check the write token installation
        env:
          MINTED: ${{ steps.write.outputs.installation-id }}
          EXPECTED: ${{ vars.MYTHOS_WRITE_APP_INSTALLATION_ID }}
        run: |
          set -euo pipefail
          test "$MINTED" = "182422539"
          test "$MINTED" = "$EXPECTED"
      - name: Sweep expired dispatch lease refs
        env:
          REPO: Sky-High-Infinite-Techwork/Mythos-Writer
          CONTROL_TOKEN: ${{ secrets.MYTHOS_CONTROL_READ_TOKEN }}
          WRITE_TOKEN: ${{ steps.write.outputs.token }}
        run: node .github/scripts/unattended/dispatch/dispatch-cli.js sweep

  claim:
    needs: [admit, sweep]
    if: needs.admit.result == 'success' && needs.admit.outputs.enabled == 'true' && needs.admit.outputs.mode == 'act' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: mythos-writer
    concurrency:
      group: mythos-unattended-dispatch
      cancel-in-progress: false
    permissions:
      contents: read
      issues: read
    steps:
      - name: Confirm the trusted ref before reading secrets
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$REPO" = "Sky-High-Infinite-Techwork/Mythos-Writer"
          test "$REF" = "refs/heads/main"
      - name: Check out the trusted default-branch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - name: Mint a contents token for dispatch claims
        id: write
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.MYTHOS_WRITE_APP_ID }}
          private-key: ${{ secrets.MYTHOS_WRITE_APP_PRIVATE_KEY }}
          owner: Sky-High-Infinite-Techwork
          repositories: Mythos-Writer
          permission-contents: write
      - name: Check the write token installation
        env:
          MINTED: ${{ steps.write.outputs.installation-id }}
          EXPECTED: ${{ vars.MYTHOS_WRITE_APP_INSTALLATION_ID }}
        run: |
          set -euo pipefail
          test "$MINTED" = "182422539"
          test "$MINTED" = "$EXPECTED"
      - name: Claim a lane for the next slice
        env:
          MODE: act
          REPO: Sky-High-Infinite-Techwork/Mythos-Writer
          MAIN_SHA: ${{ github.sha }}
          CONTROL_TOKEN: ${{ secrets.MYTHOS_CONTROL_READ_TOKEN }}
          READ_TOKEN: ${{ github.token }}
          WRITE_TOKEN: ${{ steps.write.outputs.token }}
        run: node .github/scripts/unattended/dispatch/dispatch-cli.js plan