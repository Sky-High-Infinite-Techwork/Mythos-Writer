name: Mythos dispatch

# Phase 2 dispatcher core: build-order scan, official-plan parse, atomic lane claims.
# Scheduled runs sweep stale refs only. Manual act may claim; canary is optional.
# See docs/ops/phase2-dispatcher-plan.md.

on:
  schedule:
    - cron: '4,14,24,34,44,54 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run logs would_claim (works with switches off). act sweep/claim requires switches on.'
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - act
      canary_scratch:
        description: 'When true, run parallel scratch-ref canary (manual only, requires switches on for act).'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions: {}

concurrency:
  group: ${{ github.event.inputs.canary_scratch == 'true' && format('mythos-dispatch-canary-{0}', github.ref) || format('mythos-dispatch-run-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      plan: ${{ steps.gate.outputs.plan }}
      sweep: ${{ steps.gate.outputs.sweep }}
      claim: ${{ steps.gate.outputs.claim }}
      canary: ${{ steps.gate.outputs.canary }}
    steps:
      - name: Admit dispatch jobs on main
        id: gate
        shell: bash
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          UNATTENDED: ${{ vars.UNATTENDED_ENABLED }}
          DISPATCH: ${{ vars.MYTHOS_DISPATCH_ENABLED }}
          MODE: ${{ github.event.inputs.mode }}
          CANARY: ${{ github.event.inputs.canary_scratch }}
        run: |
          set -euo pipefail
          # ADMIT-BEGIN
          if [ "$REPO" != "Sky-High-Infinite-Techwork/Mythos-Writer" ]; then
            echo "reject: repository" >&2
            exit 1
          fi
          if [ "$REF" != "refs/heads/main" ]; then
            echo "reject: ref is not main" >&2
            exit 1
          fi
          case "$EVENT" in
            schedule|workflow_dispatch) ;;
            *) echo "reject: event" >&2; exit 1 ;;
          esac
          WRITE_ON=false
          if [ "$UNATTENDED" = "true" ] && [ "$DISPATCH" = "true" ]; then
            WRITE_ON=true
          fi
          PLAN=false
          SWEEP=false
          CLAIM=false
          CANARY_RUN=false
          if [ "$EVENT" = "workflow_dispatch" ]; then
            case "$MODE" in
              dry-run) PLAN=true ;;
              act)
                if [ "$WRITE_ON" = "true" ]; then
                  SWEEP=true
                  if [ "$CANARY" != "true" ]; then
                    CLAIM=true
                  fi
                fi
                ;;
              *) echo "reject: mode" >&2; exit 1 ;;
            esac
            if [ "$CANARY" = "true" ] && [ "$MODE" = "act" ] && [ "$WRITE_ON" = "true" ]; then
              CANARY_RUN=true
            fi
          fi
          if [ "$EVENT" = "schedule" ] && [ "$WRITE_ON" = "true" ]; then
            SWEEP=true
          fi
          echo "plan=$PLAN" >> "$GITHUB_OUTPUT"
          echo "sweep=$SWEEP" >> "$GITHUB_OUTPUT"
          echo "claim=$CLAIM" >> "$GITHUB_OUTPUT"
          echo "canary=$CANARY_RUN" >> "$GITHUB_OUTPUT"
          # ADMIT-END

  discover:
    needs: admit
    if: needs.admit.result == 'success' && needs.admit.outputs.plan == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: mythos-control
    permissions:
      contents: read
      issues: read
    steps:
      - name: Confirm the trusted ref before checkout
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$REPO" = "Sky-High-Infinite-Techwork/Mythos-Writer"
          test "$REF" = "refs/heads/main"
      - name: Check out the trusted default-branch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - name: Dry-run plan (switches may be off)
        env:
          MODE: dry-run
          REPO: Sky-High-Infinite-Techwork/Mythos-Writer
          CONTROL_TOKEN: ${{ secrets.MYTHOS_CONTROL_READ_TOKEN }}
          READ_TOKEN: ${{ github.token }}
        run: node .github/scripts/unattended/dispatch/dispatch-cli.js plan

  sweep:
    needs: admit
    if: needs.admit.result == 'success' && needs.admit.outputs.sweep == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: mythos-writer
    concurrency:
      group: mythos-unattended-dispatch
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Confirm the trusted ref before reading secrets
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$REPO" = "Sky-High-Infinite-Techwork/Mythos-Writer"
          test "$REF" = "refs/heads/main"
      - name: Check out the trusted default-branch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - name: Mint a contents token for dispatch ref maintenance
        id: write
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.MYTHOS_WRITE_APP_ID }}
          private-key: ${{ secrets.MYTHOS_WRITE_APP_PRIVATE_KEY }}
          owner: Sky-High-Infinite-Techwork
          repositories: Mythos-Writer
          permission-contents: write
      - name: Check the write token installation
        env:
          MINTED: ${{ steps.write.outputs.installation-id }}
          EXPECTED: ${{ vars.MYTHOS_WRITE_APP_INSTALLATION_ID }}
        run: |
          set -euo pipefail
          test "$MINTED" = "182422539"
          test "$MINTED" = "$EXPECTED"
      - name: Sweep expired dispatch lease refs
        env:
          REPO: Sky-High-Infinite-Techwork/Mythos-Writer
          CONTROL_TOKEN: ${{ secrets.MYTHOS_CONTROL_READ_TOKEN }}
          READ_TOKEN: ${{ github.token }}
          WRITE_TOKEN: ${{ steps.write.outputs.token }}
        run: node .github/scripts/unattended/dispatch/dispatch-cli.js sweep

  claim:
    needs: [admit, sweep]
    if: needs.admit.result == 'success' && needs.admit.outputs.claim == 'true' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: mythos-writer
    concurrency:
      group: mythos-unattended-dispatch
      cancel-in-progress: false
    permissions:
      contents: read
      issues: read
    steps:
      - name: Confirm the trusted ref before reading secrets
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$REPO" = "Sky-High-Infinite-Techwork/Mythos-Writer"
          test "$REF" = "refs/heads/main"
      - name: Check out the trusted default-branch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - name: Mint a contents token for dispatch claims
        id: write
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.MYTHOS_WRITE_APP_ID }}
          private-key: ${{ secrets.MYTHOS_WRITE_APP_PRIVATE_KEY }}
          owner: Sky-High-Infinite-Techwork
          repositories: Mythos-Writer
          permission-contents: write
      - name: Check the write token installation
        env:
          MINTED: ${{ steps.write.outputs.installation-id }}
          EXPECTED: ${{ vars.MYTHOS_WRITE_APP_INSTALLATION_ID }}
        run: |
          set -euo pipefail
          test "$MINTED" = "182422539"
          test "$MINTED" = "$EXPECTED"
      - name: Claim a lane for the next slice (manual act only)
        env:
          MODE: act
          REPO: Sky-High-Infinite-Techwork/Mythos-Writer
          MAIN_SHA: ${{ github.sha }}
          CONTROL_TOKEN: ${{ secrets.MYTHOS_CONTROL_READ_TOKEN }}
          READ_TOKEN: ${{ github.token }}
          WRITE_TOKEN: ${{ steps.write.outputs.token }}
        run: node .github/scripts/unattended/dispatch/dispatch-cli.js plan

  canary:
    needs: admit
    if: needs.admit.result == 'success' && needs.admit.outputs.canary == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        index: [0, 1, 2, 3, 4, 5]
    environment: mythos-writer
    permissions:
      contents: read
    steps:
      - name: Confirm the trusted ref before reading secrets
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$REPO" = "Sky-High-Infinite-Techwork/Mythos-Writer"
          test "$REF" = "refs/heads/main"
      - name: Check out the trusted default-branch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - name: Mint a contents token for scratch ref canary
        id: write
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.MYTHOS_WRITE_APP_ID }}
          private-key: ${{ secrets.MYTHOS_WRITE_APP_PRIVATE_KEY }}
          owner: Sky-High-Infinite-Techwork
          repositories: Mythos-Writer
          permission-contents: write
      - name: Check the write token installation
        env:
          MINTED: ${{ steps.write.outputs.installation-id }}
          EXPECTED: ${{ vars.MYTHOS_WRITE_APP_INSTALLATION_ID }}
        run: |
          set -euo pipefail
          test "$MINTED" = "182422539"
          test "$MINTED" = "$EXPECTED"
      - name: Parallel scratch ref create
        env:
          MODE: act
          CANARY_INDEX: ${{ matrix.index }}
          MAIN_SHA: ${{ github.sha }}
          REPO: Sky-High-Infinite-Techwork/Mythos-Writer
          CONTROL_TOKEN: ${{ secrets.MYTHOS_CONTROL_READ_TOKEN }}
          READ_TOKEN: ${{ github.token }}
          WRITE_TOKEN: ${{ steps.write.outputs.token }}
          CANARY_OUTCOME_PATH: canary-outcome-${{ matrix.index }}.json
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node .github/scripts/unattended/dispatch/dispatch-cli.js canary-ref
      - name: Upload canary leg outcome
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: canary-outcome-${{ github.run_attempt }}-${{ matrix.index }}
          path: canary-outcome-${{ matrix.index }}.json
          if-no-files-found: error

  canary-verify:
    needs: [admit, canary]
    if: needs.admit.result == 'success' && needs.canary.result == 'success' && needs.admit.outputs.canary == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: mythos-writer
    permissions:
      contents: read
    steps:
      - name: Confirm the trusted ref before reading secrets
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$REPO" = "Sky-High-Infinite-Techwork/Mythos-Writer"
          test "$REF" = "refs/heads/main"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - name: Mint a contents token for canary cleanup
        id: write
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.MYTHOS_WRITE_APP_ID }}
          private-key: ${{ secrets.MYTHOS_WRITE_APP_PRIVATE_KEY }}
          owner: Sky-High-Infinite-Techwork
          repositories: Mythos-Writer
          permission-contents: write
      - name: Check the write token installation
        id: install-check
        env:
          MINTED: ${{ steps.write.outputs.installation-id }}
          EXPECTED: ${{ vars.MYTHOS_WRITE_APP_INSTALLATION_ID }}
        run: |
          set -euo pipefail
          test "$MINTED" = "182422539"
          test "$MINTED" = "$EXPECTED"
      - name: Download canary leg outcomes
        id: download
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: canary-outcome-${{ github.run_attempt }}-*
          merge-multiple: true
          path: canary-outcomes
      - name: Report when a retry must rerun all six canary legs
        if: failure() && steps.download.outcome == 'failure'
        run: |
          echo "retry_requires_all_six_legs: canary-verify cannot reuse outcomes from a previous attempt; rerun all six canary legs"
          exit 1
      - name: Assert single scratch ref and CAS delete
        if: ${{ success() && steps.write.outcome == 'success' && steps.install-check.outcome == 'success' }}
        env:
          MODE: act
          MAIN_SHA: ${{ github.sha }}
          REPO: Sky-High-Infinite-Techwork/Mythos-Writer
          CONTROL_TOKEN: ${{ secrets.MYTHOS_CONTROL_READ_TOKEN }}
          READ_TOKEN: ${{ github.token }}
          WRITE_TOKEN: ${{ steps.write.outputs.token }}
          CANARY_ARTIFACTS_DIR: canary-outcomes
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node .github/scripts/unattended/dispatch/dispatch-cli.js canary-verify