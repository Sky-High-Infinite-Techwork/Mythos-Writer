name: Mythos final gate

# Default-branch controller. Schedule and workflow_dispatch only.
# Model jobs hold no App token and no provider secret. The publisher is the
# only job that can mint the gate App token. See docs/ops/unattended-flow.md.

on:
  schedule:
    # Every ten minutes, offset from the top of the hour and from flow-step.
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run prints verdicts. act may post the gate check.'
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - act
      pr:
        description: 'One pull request number. Empty scans open pull requests.'
        required: false
        default: ''
        type: string

permissions: {}

jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
      mode: ${{ steps.gate.outputs.mode }}
      pr: ${{ steps.gate.outputs.pr }}
    steps:
      - name: Admit a main-branch run only when UNATTENDED_ENABLED is true
        id: gate
        shell: bash
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          SWITCH: ${{ vars.UNATTENDED_ENABLED }}
          MODE: ${{ github.event.inputs.mode }}
          PR: ${{ github.event.inputs.pr }}
        run: |
          set -euo pipefail
          # ADMIT-BEGIN
          if [ "$REPO" != "Sky-High-Infinite-Techwork/Mythos-Writer" ]; then
            echo "reject: repository" >&2
            exit 1
          fi
          if [ "$REF" != "refs/heads/main" ]; then
            echo "reject: ref is not main" >&2
            exit 1
          fi
          case "$EVENT" in
            schedule|workflow_dispatch) ;;
            *) echo "reject: event" >&2; exit 1 ;;
          esac
          if [ "$EVENT" = "schedule" ]; then
            MODE=act
          fi
          if [ "$SWITCH" != "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "mode=inert" >> "$GITHUB_OUTPUT"
            echo "pr=" >> "$GITHUB_OUTPUT"
            echo "UNATTENDED_ENABLED is not true; exiting without writes"
            exit 0
          fi
          case "$MODE" in
            dry-run|act) ;;
            *) echo "reject: mode" >&2; exit 1 ;;
          esac
          if [ -n "${PR:-}" ] && [[ ! "$PR" =~ ^[1-9][0-9]{0,9}$ ]]; then
            echo "reject: pr" >&2
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "pr=${PR:-}" >> "$GITHUB_OUTPUT"
          # ADMIT-END

  discover:
    needs: admit
    if: needs.admit.result == 'success' && needs.admit.outputs.enabled == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Confirm the trusted ref before checkout
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$REPO" = "Sky-High-Infinite-Techwork/Mythos-Writer"
          test "$REF" = "refs/heads/main"
      - name: Check out the trusted default-branch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - name: Select no head while the model transport is unapproved
        run: |
          set -euo pipefail
          echo "No head selected. The model transport is not approved, so this run cannot post a new tip success."

  transport-claude:
    needs: [admit, discover]
    if: needs.admit.result == 'success' && needs.admit.outputs.enabled == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: mythos-unattended-model
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      result: ${{ steps.emit.outputs.result }}
    steps:
      - name: Confirm the trusted ref before checkout
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$REPO" = "Sky-High-Infinite-Techwork/Mythos-Writer"
          test "$REF" = "refs/heads/main"
      - name: Check out the trusted default-branch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - name: Emit an unavailable Claude result
        id: emit
        env:
          PROVIDER: claude
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
        run: node .github/scripts/unattended/gate-result.js transport

  transport-codex:
    needs: [admit, discover]
    if: needs.admit.result == 'success' && needs.admit.outputs.enabled == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: mythos-unattended-model
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      result: ${{ steps.emit.outputs.result }}
    steps:
      - name: Confirm the trusted ref before checkout
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$REPO" = "Sky-High-Infinite-Techwork/Mythos-Writer"
          test "$REF" = "refs/heads/main"
      - name: Check out the trusted default-branch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - name: Emit an unavailable Codex result
        id: emit
        env:
          PROVIDER: codex
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
        run: node .github/scripts/unattended/gate-result.js transport

  reduce:
    needs: [admit, transport-claude, transport-codex]
    if: needs.admit.result == 'success' && needs.admit.outputs.enabled == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      result: ${{ steps.reduce.outputs.result }}
      decision: ${{ steps.reduce.outputs.decision }}
    steps:
      - name: Confirm the trusted ref before checkout
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$REPO" = "Sky-High-Infinite-Techwork/Mythos-Writer"
          test "$REF" = "refs/heads/main"
      - name: Check out the trusted default-branch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - name: Reduce transport results
        id: reduce
        env:
          CLAUDE_RESULT: ${{ needs.transport-claude.outputs.result }}
          CODEX_RESULT: ${{ needs.transport-codex.outputs.result }}
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
        run: node .github/scripts/unattended/gate-result.js reduce

  publish:
    needs: [admit, reduce]
    if: needs.admit.result == 'success' && needs.admit.outputs.enabled == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: mythos-publisher
    concurrency:
      group: mythos-unattended-mutate
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      needs_token: ${{ steps.probe.outputs.needs_token }}
    steps:
      - name: Confirm the trusted ref before reading secrets
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$REPO" = "Sky-High-Infinite-Techwork/Mythos-Writer"
          test "$REF" = "refs/heads/main"
      - name: Check out the trusted default-branch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - name: Probe queue commits without a gate token
        id: probe
        env:
          MODE: ${{ needs.admit.outputs.mode }}
          GATE_APP_ID: ${{ vars.MYTHOS_GATE_APP_ID }}
          CONTROL_TOKEN: ${{ secrets.MYTHOS_CONTROL_READ_TOKEN }}
          READ_TOKEN: ${{ github.token }}
          REDUCER_RESULT: ${{ needs.reduce.outputs.result }}
        run: |
          set -euo pipefail
          set +e
          node .github/scripts/unattended/publish-run.js
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "needs_token=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          else
            echo "needs_token=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Mint a checks token for the gate app
        id: gate
        if: steps.probe.outputs.needs_token == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.MYTHOS_GATE_APP_ID }}
          private-key: ${{ secrets.MYTHOS_GATE_APP_PRIVATE_KEY }}
          owner: Sky-High-Infinite-Techwork
          repositories: Mythos-Writer
          permission-checks: write
      - name: Check the gate token installation
        if: steps.probe.outputs.needs_token == 'true'
        env:
          MINTED: ${{ steps.gate.outputs.installation-id }}
          EXPECTED: ${{ vars.MYTHOS_GATE_APP_INSTALLATION_ID }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED"
          test "$MINTED" = "$EXPECTED"
      - name: Post queue and head results with the gate token
        if: steps.probe.outputs.needs_token == 'true'
        env:
          MODE: ${{ needs.admit.outputs.mode }}
          GATE_APP_ID: ${{ vars.MYTHOS_GATE_APP_ID }}
          CONTROL_TOKEN: ${{ secrets.MYTHOS_CONTROL_READ_TOKEN }}
          READ_TOKEN: ${{ github.token }}
          GATE_TOKEN: ${{ steps.gate.outputs.token }}
          REDUCER_RESULT: ${{ needs.reduce.outputs.result }}
        run: node .github/scripts/unattended/publish-run.js
