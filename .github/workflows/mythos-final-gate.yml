name: Mythos final gate

# Phase 1b. Schedule and workflow_dispatch from main only.
# Model jobs review a normalized diff. The publisher posts a head success
# only after the reducer accepts both transports. See docs/ops/unattended-flow.md.

on:
  schedule:
    # Every ten minutes, offset from the top of the hour and from flow-step.
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run prints verdicts. act may post the gate check.'
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - act
      pr:
        description: 'One pull request number. Empty scans open pull requests.'
        required: false
        default: ''
        type: string

permissions: {}

jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    # Literal false: Mythos-Ops Actions is the only unattended publisher. Do not switch this
    # back to a repository variable; the Ops ready check requires a literal false in this file.
    env:
      UNATTENDED_ENABLED: false
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
      mode: ${{ steps.gate.outputs.mode }}
      pr: ${{ steps.gate.outputs.pr }}
    steps:
      - name: Admit a main-branch run only when UNATTENDED_ENABLED is true
        id: gate
        shell: bash
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          MODE: ${{ github.event.inputs.mode }}
          PR: ${{ github.event.inputs.pr }}
        run: |
          set -euo pipefail
          # ADMIT-BEGIN
          if [ "$REPO" != "Sky-High-Infinite-Techwork/Mythos-Writer" ]; then
            echo "reject: repository" >&2
            exit 1
          fi
          if [ "$REF" != "refs/heads/main" ]; then
            echo "reject: ref is not main" >&2
            exit 1
          fi
          case "$EVENT" in
            schedule|workflow_dispatch) ;;
            *) echo "reject: event" >&2; exit 1 ;;
          esac
          if [ "$EVENT" = "schedule" ]; then
            MODE=act
          fi
          if [ "$UNATTENDED_ENABLED" != "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "mode=inert" >> "$GITHUB_OUTPUT"
            echo "pr=" >> "$GITHUB_OUTPUT"
            echo "UNATTENDED_ENABLED is not true; exiting without writes"
            exit 0
          fi
          case "$MODE" in
            dry-run|act) ;;
            *) echo "reject: mode" >&2; exit 1 ;;
          esac
          if [ -n "${PR:-}" ] && [[ ! "$PR" =~ ^[1-9][0-9]{0,9}$ ]]; then
            echo "reject: pr" >&2
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "pr=${PR:-}" >> "$GITHUB_OUTPUT"
          # ADMIT-END

  discover:
    needs: admit
    if: needs.admit.result == 'success' && needs.admit.outputs.enabled == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      pr: ${{ steps.pick.outputs.pr }}
      head: ${{ steps.pick.outputs.head }}
      base: ${{ steps.pick.outputs.base }}
      threshold: ${{ steps.pick.outputs.threshold }}
      run_claude: ${{ steps.pick.outputs.run_claude }}
      run_codex: ${{ steps.pick.outputs.run_codex }}
    steps:
      - name: Confirm the trusted ref before checkout
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$REPO" = "Sky-High-Infinite-Techwork/Mythos-Writer"
          test "$REF" = "refs/heads/main"
      - name: Check out the trusted default-branch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - name: Select one open main pull request
        id: pick
        env:
          REPO: Sky-High-Infinite-Techwork/Mythos-Writer
          PR_NUMBER: ${{ needs.admit.outputs.pr }}
          READ_TOKEN: ${{ github.token }}
          MYTHOS_FLOW_AUTHOR_ALLOWLIST: ${{ vars.MYTHOS_FLOW_AUTHOR_ALLOWLIST }}
          MYTHOS_GATE_PROVIDERS_JSON: ${{ toJSON(vars.MYTHOS_GATE_PROVIDERS) }}
        run: node .github/scripts/unattended/discover-run.js

  transport-claude:
    needs: [admit, discover]
    if: needs.admit.result == 'success' && needs.admit.outputs.enabled == 'true' && github.ref == 'refs/heads/main' && needs.discover.outputs.run_claude == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: mythos-claude
    concurrency:
      group: mythos-unattended-model
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
    outputs:
      result: ${{ steps.review.outputs.result }}
    steps:
      - name: Confirm the trusted ref before checkout
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$REPO" = "Sky-High-Infinite-Techwork/Mythos-Writer"
          test "$REF" = "refs/heads/main"
      - name: Check out the trusted default-branch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - name: Install the Claude Code CLI
        run: npm install --global @anthropic-ai/claude-code@2.1.325
      - name: Review the normalized diff with Claude
        id: review
        env:
          PROVIDER: claude
          REPO: Sky-High-Infinite-Techwork/Mythos-Writer
          PR_NUMBER: ${{ needs.discover.outputs.pr }}
          HEAD_SHA: ${{ needs.discover.outputs.head }}
          BASE_SHA: ${{ needs.discover.outputs.base }}
          READ_TOKEN: ${{ github.token }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node .github/scripts/unattended/transport-run.js

  transport-codex:
    needs: [admit, discover]
    if: needs.admit.result == 'success' && needs.admit.outputs.enabled == 'true' && github.ref == 'refs/heads/main' && needs.discover.outputs.run_codex == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: mythos-codex
    concurrency:
      group: mythos-unattended-model
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
    outputs:
      result: ${{ steps.review.outputs.result }}
    steps:
      - name: Confirm the trusted ref before checkout
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$REPO" = "Sky-High-Infinite-Techwork/Mythos-Writer"
          test "$REF" = "refs/heads/main"
      - name: Check out the trusted default-branch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - name: Review the normalized diff with Codex
        id: review
        env:
          PROVIDER: codex
          REPO: Sky-High-Infinite-Techwork/Mythos-Writer
          PR_NUMBER: ${{ needs.discover.outputs.pr }}
          HEAD_SHA: ${{ needs.discover.outputs.head }}
          BASE_SHA: ${{ needs.discover.outputs.base }}
          READ_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node .github/scripts/unattended/transport-run.js

  reduce:
    needs: [admit, discover, transport-claude, transport-codex]
    if: always() && needs.admit.result == 'success' && needs.admit.outputs.enabled == 'true' && github.ref == 'refs/heads/main' && (needs.transport-claude.result == 'success' || needs.transport-claude.result == 'skipped') && (needs.transport-codex.result == 'success' || needs.transport-codex.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      result: ${{ steps.reduce.outputs.result }}
      decision: ${{ steps.reduce.outputs.decision }}
    steps:
      - name: Confirm the trusted ref before checkout
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$REPO" = "Sky-High-Infinite-Techwork/Mythos-Writer"
          test "$REF" = "refs/heads/main"
      - name: Check out the trusted default-branch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - name: Reduce transport results
        id: reduce
        env:
          CLAUDE_RESULT: ${{ needs.transport-claude.outputs.result }}
          CODEX_RESULT: ${{ needs.transport-codex.outputs.result }}
          THRESHOLD: ${{ needs.discover.outputs.threshold }}
          MYTHOS_GATE_PROVIDERS_JSON: ${{ toJSON(vars.MYTHOS_GATE_PROVIDERS) }}
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
        run: node .github/scripts/unattended/gate-result.js reduce

  publish:
    needs: [admit, discover, reduce]
    if: needs.admit.result == 'success' && needs.admit.outputs.enabled == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: mythos-publisher
    concurrency:
      group: mythos-unattended-mutate
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: read
      checks: read
    outputs:
      needs_token: ${{ steps.probe.outputs.needs_token }}
    steps:
      - name: Confirm the trusted ref before reading secrets
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$REPO" = "Sky-High-Infinite-Techwork/Mythos-Writer"
          test "$REF" = "refs/heads/main"
      - name: Check out the trusted default-branch commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - name: Probe queue commits without a gate token
        id: probe
        env:
          MODE: ${{ needs.admit.outputs.mode }}
          GATE_APP_ID: ${{ vars.MYTHOS_GATE_APP_ID }}
          CONTROL_TOKEN: ${{ secrets.MYTHOS_CONTROL_READ_TOKEN }}
          READ_TOKEN: ${{ github.token }}
          REDUCER_RESULT: ${{ needs.reduce.outputs.result }}
          PR_NUMBER: ${{ needs.admit.outputs.pr }}
          THRESHOLD: ${{ needs.discover.outputs.threshold }}
          MYTHOS_GATE_PROVIDERS_JSON: ${{ toJSON(vars.MYTHOS_GATE_PROVIDERS) }}
        run: |
          set -euo pipefail
          set +e
          node .github/scripts/unattended/publish-run.js
          code=$?
          set -e
          if [ "$code" -eq 2 ]; then
            echo "needs_token=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          else
            echo "needs_token=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Mint a checks token for the gate app
        id: gate
        if: steps.probe.outputs.needs_token == 'true'
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.MYTHOS_GATE_APP_ID }}
          private-key: ${{ secrets.MYTHOS_GATE_APP_PRIVATE_KEY }}
          owner: Sky-High-Infinite-Techwork
          repositories: Mythos-Writer
          permission-checks: write
      - name: Check the gate token installation
        if: steps.probe.outputs.needs_token == 'true'
        env:
          MINTED: ${{ steps.gate.outputs.installation-id }}
          EXPECTED: ${{ vars.MYTHOS_GATE_APP_INSTALLATION_ID }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED"
          test "$MINTED" = "$EXPECTED"
      - name: Check the gate token grant
        if: steps.probe.outputs.needs_token == 'true'
        env:
          TOKEN: ${{ steps.gate.outputs.token }}
        run: node .github/scripts/unattended/token-grant.js
      - name: Post queue and head results with the gate token
        if: steps.probe.outputs.needs_token == 'true'
        env:
          MODE: ${{ needs.admit.outputs.mode }}
          GATE_APP_ID: ${{ vars.MYTHOS_GATE_APP_ID }}
          CONTROL_TOKEN: ${{ secrets.MYTHOS_CONTROL_READ_TOKEN }}
          READ_TOKEN: ${{ github.token }}
          GATE_TOKEN: ${{ steps.gate.outputs.token }}
          REDUCER_RESULT: ${{ needs.reduce.outputs.result }}
          PR_NUMBER: ${{ needs.admit.outputs.pr }}
          THRESHOLD: ${{ needs.discover.outputs.threshold }}
          MYTHOS_GATE_PROVIDERS_JSON: ${{ toJSON(vars.MYTHOS_GATE_PROVIDERS) }}
        run: node .github/scripts/unattended/publish-run.js
