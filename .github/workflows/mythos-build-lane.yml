name: Mythos build lane

# Phase 2: model build job separate from trusted write / PR publish.
# See docs/ops/phase2-dispatcher-plan.md

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'dry-run validates artifact only. act may open a draft PR.'
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - act
      provider:
        description: 'claude primary lane; codex alternate'
        required: true
        default: claude
        type: choice
        options:
          - claude
          - codex

permissions: {}

jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
      mode: ${{ steps.gate.outputs.mode }}
      provider: ${{ steps.gate.outputs.provider }}
    steps:
      - name: Admit build lane when dispatch switches are true
        id: gate
        shell: bash
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          UNATTENDED: ${{ vars.UNATTENDED_ENABLED }}
          DISPATCH: ${{ vars.MYTHOS_DISPATCH_ENABLED }}
          MODE: ${{ github.event.inputs.mode }}
          PROVIDER: ${{ github.event.inputs.provider }}
        run: |
          set -euo pipefail
          if [ "$REPO" != "Sky-High-Infinite-Techwork/Mythos-Writer" ]; then exit 1; fi
          if [ "$REF" != "refs/heads/main" ]; then exit 1; fi
          if [ "$UNATTENDED" != "true" ] || [ "$DISPATCH" != "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$MODE" in dry-run|act) ;; *) exit 1 ;; esac
          case "$PROVIDER" in claude|codex) ;; *) exit 1 ;; esac
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "provider=$PROVIDER" >> "$GITHUB_OUTPUT"

  build:
    needs: admit
    if: needs.admit.result == 'success' && needs.admit.outputs.enabled == 'true' && needs.admit.outputs.provider == 'claude'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: mythos-claude
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      # id-token: write is forbidden on provider jobs (no OIDC write for models).
      - name: Run Claude Code build lane
        uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1.0.276
        with:
          github_token: ${{ github.token }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: 'Emit mythos-build-artifact/v1 JSON only for the claimed slice; do not push.'
      - name: Record build transport stdout
        run: |
          set -euo pipefail
          node .github/scripts/unattended/dispatch/build-transport-run.js | tee build-artifact.json
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: build-lane-claude-${{ github.run_id }}
          path: build-artifact.json
          if-no-files-found: error

  build-codex:
    needs: admit
    if: needs.admit.result == 'success' && needs.admit.outputs.enabled == 'true' && needs.admit.outputs.provider == 'codex'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: mythos-codex
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - name: Run Codex build transport
        env:
          BUILD_PROVIDER: codex
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node .github/scripts/unattended/dispatch/build-transport-run.js | tee build-artifact.json
      - uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: build-lane-codex-${{ github.run_id }}
          path: build-artifact.json
          if-no-files-found: error

  push-build:
    needs: [admit, build, build-codex]
    if: ${{ !cancelled() && needs.admit.result == 'success' && needs.admit.outputs.enabled == 'true' && (needs.build.result == 'success' || needs.build-codex.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: mythos-writer
    concurrency:
      group: mythos-unattended-mutate
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      build_head: ${{ steps.push.outputs.build_head }}
    steps:
      - name: Confirm the trusted ref before reading secrets
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$REPO" = "Sky-High-Infinite-Techwork/Mythos-Writer"
          test "$REF" = "refs/heads/main"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - name: Mint a contents token for trusted build ref
        id: write
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.MYTHOS_WRITE_APP_ID }}
          private-key: ${{ secrets.MYTHOS_WRITE_APP_PRIVATE_KEY }}
          owner: Sky-High-Infinite-Techwork
          repositories: Mythos-Writer
          permission-contents: write
      - name: Check the write token installation
        env:
          MINTED: ${{ steps.write.outputs.installation-id }}
          EXPECTED: ${{ vars.MYTHOS_WRITE_APP_INSTALLATION_ID }}
        run: |
          set -euo pipefail
          test "$MINTED" = "182422539"
          test "$MINTED" = "$EXPECTED"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build-lane-${{ needs.admit.outputs.provider }}-${{ github.run_id }}
          path: build-artifact
      - name: Push trusted build ref (model never pushes)
        id: push
        env:
          REPO: ${{ github.repository }}
          MAIN_SHA: ${{ github.sha }}
          BUILD_PROVIDER: ${{ needs.admit.outputs.provider }}
          WRITE_TOKEN: ${{ steps.write.outputs.token }}
        run: |
          set -euo pipefail
          export BUILD_ARTIFACT_STDOUT="$(cat build-artifact/build-artifact.json)"
          OUT="$(node .github/scripts/unattended/dispatch/build-lane-push-run.js)"
          HEAD="$(node -e 'console.log(JSON.parse(process.argv[1]).build_head)' "$OUT")"
          test -n "$HEAD"
          echo "build_head=$HEAD" >> "$GITHUB_OUTPUT"

  publish:
    needs: [admit, build, build-codex, push-build]
    if: ${{ !cancelled() && needs.admit.result == 'success' && needs.admit.outputs.enabled == 'true' && needs.push-build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: mythos-writer
    concurrency:
      group: mythos-unattended-mutate
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Confirm the trusted ref before reading secrets
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          test "$REPO" = "Sky-High-Infinite-Techwork/Mythos-Writer"
          test "$REF" = "refs/heads/main"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ vars.MYTHOS_DISPATCH_MAIN_SHA }}
          persist-credentials: false
          fetch-depth: 0
          submodules: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: build-lane-${{ needs.admit.outputs.provider }}-${{ github.run_id }}
          path: build-artifact
      - name: Fetch trusted build ref head
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_REF: refs/mythos/build/${{ needs.admit.outputs.provider }}
        run: |
          set -euo pipefail
          SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/$(printf %s "$BUILD_REF" | jq -sRr @uri)" --jq .object.sha)
          test -n "$SHA"
          git fetch --depth=1 origin "$SHA"
          echo "BUILD_HEAD_SHA=$SHA" >> "$GITHUB_ENV"
      - name: Validate trusted git diff against claim (not artifact self-report)
        env:
          MODE: ${{ needs.admit.outputs.mode }}
          MAIN_SHA: ${{ vars.MYTHOS_DISPATCH_MAIN_SHA }}
          BUILD_HEAD_SHA: ${{ needs.push-build.outputs.build_head }}
          CLAIM_FILES: ${{ vars.MYTHOS_BUILD_LANE_CLAIM_FILES }}
        run: |
          set -euo pipefail
          test -n "${MAIN_SHA}"
          test -n "${BUILD_HEAD_SHA}"
          test "${BUILD_HEAD_SHA}" = "${{ env.BUILD_HEAD_SHA }}"
          export BUILD_ARTIFACT_STDOUT="$(cat build-artifact/build-artifact.json)"
          node .github/scripts/unattended/dispatch/build-lane-verify-run.js