name: Mythos plan gate

# Phase 2: Opus plan draft + independent Fable grade loop before build dispatch.
# See docs/ops/phase2-dispatcher-plan.md

on:
  workflow_dispatch:
    inputs:
      issue:
        description: 'Build-order issue number'
        required: true
        type: string
      mode:
        description: 'dry-run skips issue comment. act posts PLAN GRADE PASS when transport passes.'
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - act

permissions: {}

jobs:
  admit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
      mode: ${{ steps.gate.outputs.mode }}
      issue: ${{ steps.gate.outputs.issue }}
    steps:
      - name: Admit plan gate when both dispatch switches are true
        id: gate
        shell: bash
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          UNATTENDED: ${{ vars.UNATTENDED_ENABLED }}
          DISPATCH: ${{ vars.MYTHOS_DISPATCH_ENABLED }}
          MODE: ${{ github.event.inputs.mode }}
          ISSUE: ${{ github.event.inputs.issue }}
        run: |
          set -euo pipefail
          if [ "$REPO" != "Sky-High-Infinite-Techwork/Mythos-Writer" ]; then exit 1; fi
          if [ "$REF" != "refs/heads/main" ]; then exit 1; fi
          if [ "$UNATTENDED" != "true" ] || [ "$DISPATCH" != "true" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "mode=inert" >> "$GITHUB_OUTPUT"
            echo "issue=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$MODE" in dry-run|act) ;; *) exit 1 ;; esac
          if [[ ! "$ISSUE" =~ ^[1-9][0-9]{0,9}$ ]]; then exit 1; fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "issue=$ISSUE" >> "$GITHUB_OUTPUT"

  plan-opus:
    needs: admit
    if: needs.admit.result == 'success' && needs.admit.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: mythos-claude
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - name: Draft official plan (Opus transport)
        env:
          PLAN_ROLE: plan
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node .github/scripts/unattended/dispatch/plan-transport-run.js

  grade-fable:
    needs: [admit, plan-opus]
    if: needs.admit.result == 'success' && needs.admit.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: mythos-claude
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - name: Grade plan independently (Fable transport)
        env:
          PLAN_ROLE: grade
          GITHUB_TOKEN: ''
          GH_TOKEN: ''
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: node .github/scripts/unattended/dispatch/plan-transport-run.js

  publish-pass:
    needs: [admit, grade-fable]
    if: needs.admit.result == 'success' && needs.admit.outputs.enabled == 'true' && needs.admit.outputs.mode == 'act'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: mythos-writer
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
          submodules: false
      - name: Post bound PLAN GRADE PASS when reducer accepts
        env:
          ISSUE: ${{ needs.admit.outputs.issue }}
          READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "plan gate publish awaits live transport PASS (see plan-transport-run.js)"